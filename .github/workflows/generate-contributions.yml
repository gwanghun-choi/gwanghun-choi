name: Generate Contribution Graph

on:
  workflow_dispatch:
  schedule:
    - cron: "15 15 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate recent contribution SVG
        env:
          GH_USERNAME: gwanghun-choi
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python scripts/generate_contributions.py

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-contributions-90d.svg

          if git diff --cached --quiet; then
            echo "No contribution graph changes."
            exit 0
          fi

          git commit -m "chore: update recent contribution graph"
          git push
